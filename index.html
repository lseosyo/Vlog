<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2초 로그</title>
<style>
:root{--bg:#faf8f5;--fg:#1c1b1a;--card:#fff;--mut:#8a857e;--ac:#e5484d;--bd:#e8e3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131211;--fg:#f2efea;--card:#1e1c1a;--mut:#9a948b;--bd:#2e2b28}}
:root[data-theme="dark"]{--bg:#131211;--fg:#f2efea;--card:#1e1c1a;--mut:#9a948b;--bd:#2e2b28}
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:3/4}
video#pv{width:100%;height:100%;object-fit:cover}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;font-size:14px;line-height:1.5}
.bar{display:flex;align-items:center;justify-content:center;gap:28px;margin:16px 0}
#rec{width:76px;height:76px;border-radius:50%;border:4px solid var(--fg);background:var(--ac);position:relative;cursor:pointer}
#rec.on{animation:p .5s infinite alternate}
@keyframes p{to{transform:scale(.88)}}
.sm{background:var(--card);border:1px solid var(--bd);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;cursor:pointer}
.prog{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:-6px;margin-bottom:12px}
.prog i{display:block;height:100%;width:0;background:var(--ac)}
h2{font-size:15px;margin:20px 0 8px}
.day{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:15px}.row span{color:var(--mut);font-size:13px}
.th{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.th video{width:56px;height:76px;object-fit:cover;border-radius:8px;flex:none;background:#000}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:96px}
.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#out{display:none;margin-top:10px}
#out video{width:100%;border-radius:12px;background:#000}
.hint{color:var(--mut);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<h1>2초 로그</h1>
<div class="sub" id="today"></div>

<div class="cam">
  <video id="pv" playsinline muted autoplay></video>
  <div class="msg" id="msg">카메라를 켜는 중…</div>
</div>
<div class="bar">
  <button class="sm" id="flip">전환</button>
  <button id="rec" aria-label="2초 촬영"></button>
  <button class="sm" id="cnt">오늘 0개</button>
</div>
<div class="prog"><i id="pg"></i></div>

<h2>날짜별 기록</h2>
<div id="days"></div>

<div id="out">
  <video id="ov" controls playsinline></video>
  <div class="hint" id="oh"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let db,stream,facing='environment',busy=false;

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('setlog',1);
  r.onupgradeneeded=()=>{const d=r.result;
    d.createObjectStore('clips',{keyPath:'id',autoIncrement:true}).createIndex('date','date');
    d.createObjectStore('days',{keyPath:'date'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const tx=(st,mode,fn)=>new Promise((res,rej)=>{
  const t=db.transaction(st,mode);const q=fn(t);
  t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});
const allClips=()=>tx('clips','readonly',t=>t.objectStore('clips').getAll());
const addClip=c=>tx('clips','readwrite',t=>t.objectStore('clips').add(c));
const delClip=id=>tx('clips','readwrite',t=>t.objectStore('clips').delete(id));
const getDay=d=>tx('days','readonly',t=>t.objectStore('days').get(d));
const putDay=o=>tx('days','readwrite',t=>t.objectStore('days').put(o));

async function startCam(){
  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true});
    $('#pv').srcObject=stream;$('#msg').style.display='none';
  }catch(e){
    $('#msg').style.display='flex';
    $('#msg').textContent='카메라를 사용할 수 없어요. 권한을 허용했는지 확인해 주세요.';
  }
}

function record(){
  if(busy||!stream)return;busy=true;
  $('#rec').classList.add('on');
  const mr=new MediaRecorder(stream);const parts=[];
  mr.ondataavailable=e=>e.data.size&&parts.push(e.data);
  mr.onstop=async()=>{
    const blob=new Blob(parts,{type:mr.mimeType||'video/webm'});
    await addClip({date:dkey(),ts:Date.now(),blob});
    $('#rec').classList.remove('on');$('#pg').style.width='0';busy=false;render();
  };
  mr.start();
  const t0=performance.now();
  (function tick(){const p=Math.min((performance.now()-t0)/2000,1);
    $('#pg').style.width=p*100+'%';if(p<1)requestAnimationFrame(tick);})();
  setTimeout(()=>mr.state!=='inactive'&&mr.stop(),2000);
}

async function render(){
  const clips=await allClips();
  const by={};clips.forEach(c=>(by[c.date]=by[c.date]||[]).push(c));
  const today=dkey();
  $('#cnt').textContent='오늘 '+(by[today]?by[today].length:0)+'개';
  const dates=Object.keys(by).sort().reverse();
  const box=$('#days');box.innerHTML='';
  if(!dates.length){box.innerHTML='<div class="hint">아직 기록이 없어요. 빨간 버튼을 눌러 첫 2초를 남겨보세요.</div>';return;}
  for(const d of dates){
    const list=by[d].sort((a,b)=>a.ts-b.ts);
    const el=document.createElement('div');el.className='day';
    el.innerHTML='<div class="row"><b>'+d+'</b><span>'+list.length+'개 · '+list.length*2+'초</span></div><div class="th"></div><div class="btns"><button class="sm" data-a="play">이어보기</button><button class="sm pri" data-a="merge">하루 영상 만들기</button></div>';
    const th=el.querySelector('.th');
    list.forEach(c=>{
      const v=document.createElement('video');v.muted=true;v.playsInline=true;
      v.src=URL.createObjectURL(c.blob);
      v.onclick=()=>{if(confirm('이 클립을 삭제할까요?'))delClip(c.id).then(render);};
      th.appendChild(v);
    });
    el.querySelector('[data-a=play]').onclick=()=>playSeq(list);
    el.querySelector('[data-a=merge]').onclick=e=>merge(d,list,e.target);
    box.appendChild(el);
    getDay(d).then(o=>{if(o)showOut(o.blob,d+' 합친 영상');});
  }
}

function showOut(blob,label){
  $('#out').style.display='block';
  $('#ov').src=URL.createObjectURL(blob);
  $('#oh').textContent=label+' · 길게 눌러 저장하거나 화면 녹화를 이용하세요.';
  $('#out').scrollIntoView({behavior:'smooth'});
}

async function playSeq(list){
  $('#out').style.display='block';$('#oh').textContent='클립 이어서 재생 중…';
  const v=$('#ov');v.controls=false;
  for(const c of list){
    v.src=URL.createObjectURL(c.blob);
    await new Promise(r=>{v.onended=r;v.onerror=r;v.play().catch(r);});
  }
  v.controls=true;$('#oh').textContent='재생 끝';
}

async function merge(d,list,btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent='합치는 중…';
  try{
    const v=document.createElement('video');v.playsInline=true;
    const cv=document.createElement('canvas');const cx=cv.getContext('2d');
    v.src=URL.createObjectURL(list[0].blob);
    await new Promise(r=>{v.onloadedmetadata=r;});
    const W=v.videoWidth||720,H=v.videoHeight||1280;cv.width=W;cv.height=H;
    const out=cv.captureStream(30);
    try{
      const ac=new AudioContext();const dest=ac.createMediaStreamDestination();
      ac.createMediaElementSource(v).connect(dest);
      dest.stream.getAudioTracks().forEach(t=>out.addTrack(t));
    }catch(e){}
    const mr=new MediaRecorder(out);const parts=[];
    mr.ondataavailable=e=>e.data.size&&parts.push(e.data);
    const done=new Promise(r=>mr.onstop=r);
    mr.start();
    let live=true;
    (function draw(){if(!live)return;
      if(v.videoWidth){const s=Math.min(W/v.videoWidth,H/v.videoHeight);
        const w=v.videoWidth*s,h=v.videoHeight*s;
        cx.fillStyle='#000';cx.fillRect(0,0,W,H);cx.drawImage(v,(W-w)/2,(H-h)/2,w,h);}
      requestAnimationFrame(draw);})();
    for(let i=0;i<list.length;i++){
      if(i>0)v.src=URL.createObjectURL(list[i].blob);
      await new Promise(r=>{v.onended=r;v.onerror=r;v.play().catch(r);});
    }
    live=false;mr.stop();await done;
    const blob=new Blob(parts,{type:mr.mimeType||'video/webm'});
    await putDay({date:d,blob});
    showOut(blob,d+' 합친 영상');
  }catch(e){alert('합치기에 실패했어요: '+e.message);}
  btn.disabled=false;btn.textContent=old;
}

(async()=>{
  const n=new Date();
  $('#today').textContent=n.getFullYear()+'년 '+(n.getMonth()+1)+'월 '+n.getDate()+'일 · 버튼을 누르면 2초만 저장돼요';
  try{db=await openDB();}catch(e){$('#msg').textContent='저장소를 사용할 수 없어요.';return;}
  $('#rec').onclick=record;
  $('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';startCam();};
  render();startCam();
})();
</script>
</body>
</html>
